    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "mysqlclient>=2.3.0",
]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "django>=5.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "flake8>=7.4.1",
    "mysqlclient>=2.3.0",
    "pytest-django>=4.14.0",
]
